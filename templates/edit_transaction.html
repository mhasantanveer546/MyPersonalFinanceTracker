{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block content %}
<div class="form-header"><h1>Edit Transaction</h1></div>
<div class="card form-card mt-4">
    <form method="POST" action="/edit-transaction/{{ transaction.id }}" class="form">
        <div class="form-group">
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="income" {% if transaction.type == "income" %}selected{% endif %}>Income</option>
                <option value="expense" {% if transaction.type == "expense" %}selected{% endif %}>Expense</option>
            </select>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" value="{{ transaction.category }}" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" step="0.01" id="amount" name="amount" value="{{ transaction.amount }}" required>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" value="{{ transaction.date }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" value="{{ transaction.description }}">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Transaction</button>
    </form>
</div>
<p class="mt-4"><a href="/transactions">&larr; Back to Transactions</a></p>
{% endblock %}
