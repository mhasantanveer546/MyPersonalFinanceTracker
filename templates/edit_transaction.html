<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Transaction</title>
</head>
<body>
    <h1>Edit Transaction</h1>
    <form method="POST" action="/edit-transaction/{{ transaction.id }}">
        <label for="type">Type</label><br>
        <select id="type" name="type" required>
            <option value="income" {% if transaction.type == "income" %}selected{% endif %}>Income</option>
            <option value="expense" {% if transaction.type == "expense" %}selected{% endif %}>Expense</option>
        </select><br><br>

        <label for="category">Category</label><br>
        <input type="text" id="category" name="category" value="{{ transaction.category }}" required><br><br>

        <label for="amount">Amount</label><br>
        <input type="number" step="0.01" id="amount" name="amount" value="{{ transaction.amount }}" required><br><br>

        <label for="date">Date</label><br>
        <input type="date" id="date" name="date" value="{{ transaction.date }}" required><br><br>

        <label for="description">Description</label><br>
        <input type="text" id="description" name="description" value="{{ transaction.description }}"><br><br>

        <button type="submit">Update Transaction</button>
    </form>
    <br>
    <a href="/transactions">Back to Transactions</a>
</body>
</html>
