{% extends "base.html" %}
{% block title %}Add Budget{% endblock %}
{% block content %}
<div class="form-header"><h1>Add Budget</h1></div>
<div class="card form-card mt-4">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST" action="/add-budget" class="form">
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" required>
        </div>
        <div class="form-group">
            <label for="limit_amount">Limit Amount</label>
            <input type="number" step="0.01" id="limit_amount" name="limit_amount" required>
        </div>
        <div class="form-group">
            <label for="month">Month</label>
            <input type="month" id="month" name="month" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Budget</button>
    </form>
</div>
<p class="mt-4"><a href="/budgets">&larr; Back to Budgets</a></p>
{% endblock %}
