{% extends "base.html" %}
{% block title %}Add Budget{% endblock %}
{% block content %}
<h1>Add Budget</h1>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<form method="POST" action="/add-budget">
    <label for="category">Category</label><br>
    <input type="text" id="category" name="category" required><br><br>

    <label for="limit_amount">Limit Amount</label><br>
    <input type="number" step="0.01" id="limit_amount" name="limit_amount" required><br><br>

    <label for="month">Month</label><br>
    <input type="month" id="month" name="month" required><br><br>

    <button type="submit">Add Budget</button>
</form>
<p>
    <a href="/budgets">Back to Budgets</a>
</p>
{% endblock %}
