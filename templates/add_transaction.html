{% extends "base.html" %}
{% block title %}Add Transaction{% endblock %}
{% block content %}
<div class="form-header"><h1>Add Transaction</h1></div>
<div class="card form-card mt-4">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST" action="/add-transaction" class="form">
        <div class="form-group">
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" step="0.01" id="amount" name="amount" required>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Transaction</button>
    </form>
</div>
<p class="mt-4"><a href="/transactions">&larr; Back to Transactions</a></p>
{% endblock %}
